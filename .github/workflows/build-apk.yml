name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      # The runner has plenty of RAM; give Gradle a normal heap.
      - name: Tune Gradle memory for CI
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G/' android/gradle.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fitlog-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
